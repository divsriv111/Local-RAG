<div class="login-container">
    <p-toast />
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                <p-card>
                    <ng-template pTemplate="header">
                        <div class="text-center pt-4 pb-2">
                            <h2 class="mb-1">Welcome Back</h2>
                            <p class="text-muted">Login to your account</p>
                        </div>
                    </ng-template>

                    <ng-template pTemplate="content">
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <!-- Username Field -->
                            <div class="mb-4">
                                <label for="username" class="form-label fw-semibold">
                                    Username <span class="text-danger">*</span>
                                </label>
                                <input pInputText id="username" formControlName="username"
                                    placeholder="Enter your username" class="w-100"
                                    [class.ng-invalid]="username?.invalid && username?.touched"
                                    [class.ng-dirty]="username?.touched" />
                                <small *ngIf="username?.invalid && username?.touched" class="text-danger d-block mt-1">
                                    <i class="pi pi-exclamation-circle"></i>
                                    Username is required
                                </small>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">
                                    Password <span class="text-danger">*</span>
                                </label>
                                <p-password formControlName="password" placeholder="Enter your password"
                                    [toggleMask]="true" [feedback]="false" styleClass="w-100" inputStyleClass="w-100"
                                    [class.ng-invalid]="password?.invalid && password?.touched"
                                    [class.ng-dirty]="password?.touched" />
                                <small *ngIf="password?.invalid && password?.touched" class="text-danger d-block mt-1">
                                    <i class="pi pi-exclamation-circle"></i>
                                    Password is required
                                </small>
                            </div>

                            <!-- Login Button -->
                            <div class="mb-3">
                                <p-button type="submit" label="Login" icon="pi pi-sign-in" [loading]="isLoading"
                                    [disabled]="loginForm.invalid || isLoading" styleClass="w-100 p-button-lg" />
                            </div>
                        </form>
                    </ng-template>

                    <ng-template pTemplate="footer">
                        <div class="text-center">
                            <p class="mb-0">
                                Don't have an account?
                                <a routerLink="/auth/register" class="text-primary fw-semibold">
                                    Register here
                                </a>
                            </p>
                        </div>
                    </ng-template>
                </p-card>
            </div>
        </div>
    </div>
</div>
